[workspace]
resolver = "2"
members = ["crates/core", "crates/plugin", "xtask"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Keep unwinding: every FFI entry point catches panics so a bug never takes X-Plane down.
panic = "unwind"
