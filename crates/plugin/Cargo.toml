[package]
name = "pauseattod"
description = "X-Plane plugin that pauses the sim at top of descent, a waypoint, an altitude or a timer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "0.37", default-features = false }
pauseattod-core = { path = "../core" }
